name: 승인 등록과 Pages 게시
on:
  push:
    branches: [main]
  issues:
    types: [labeled]
  workflow_dispatch:

permissions: {}

jobs:
  approve:
    if: >-
      github.event_name == 'issues' &&
      github.event.sender.id == 67542685 &&
      (github.event.label.name == '등록승인' || github.event.label.name == '등록취소')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: registration-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
    outputs:
      ready: ${{ steps.register.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: 승인 권한 및 스냅샷 검증
        id: register
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/register.mjs

  publish:
    needs: [approve]
    if: >-
      always() &&
      ((github.event_name == 'issues' && needs.approve.outputs.ready == 'true') ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: 보안 검사와 정적 데이터 빌드
        run: |
          node --test tests/*.test.mjs
          node scripts/build.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: GitHub Pages 게시
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  complete:
    needs: [approve, publish]
    if: >-
      github.event_name == 'issues' && needs.approve.outputs.ready == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: 게시 완료 기록
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/complete.mjs
